<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SA Learning Hub</title>
  <link rel="stylesheet" href="./assets/css/style.css" />
</head>
<body>
  <header class="topbar">
    <nav class="nav">
      <a href="./index.html">首頁</a>
      <a href="./weekly.html">每週進度</a>
      <a href="./mindmap.html">心智圖</a>
      <a href="../README.md">README</a>
    </nav>
  </header>

  <main class="page">
    <section class="hero card">
      <div class="eyebrow">目前焦點</div>
      <h1 id="hero-title">SA Learning Hub</h1>
      <p id="hero-subtitle" class="muted"></p>
      <div class="hero-focus-wrap">
        <span class="focus-label">本輪主線</span>
        <div id="hero-focus" class="focus-chip"></div>
      </div>
      <div class="hero-meta">
        <div class="meta-card">
          <div class="meta-label">目前進度</div>
          <div id="hero-progress" class="meta-value">-</div>
        </div>
        <div class="meta-card">
          <div class="meta-label">下一步</div>
          <div id="hero-next" class="meta-value">-</div>
        </div>
      </div>
    </section>

    <section class="grid two">
      <div class="card">
        <h2>本週焦點與節奏</h2>
        <div id="current-week-detail" class="stack"></div>
      </div>
      <div class="card">
        <h2>學習儀式感</h2>
        <ul id="rituals" class="bullet-list"></ul>
      </div>
    </section>

    <section class="card">
      <div class="section-head align-top">
        <div>
          <h2>12 週進度總覽</h2>
          <p class="section-sub">先看目前進度，再視需要展開全部 12 週安排。</p>
        </div>
        <div class="section-actions">
          <span id="weeks-summary" class="summary-chip"></span>
          <button id="toggle-weeks" class="ghost-btn" type="button">查看更多</button>
        </div>
      </div>
      <div id="week-cards" class="week-grid"></div>
    </section>

    <section class="grid two board-section">
      <div class="card board-card">
        <div class="section-head simple">
          <h2>任務進度</h2>
        </div>
        <div class="board two-col">
          <div class="column">
            <div class="column-title">進行中</div>
            <div id="board-doing" class="column-body"></div>
          </div>
          <div class="column">
            <div class="column-title">待開始</div>
            <div id="board-todo" class="column-body"></div>
          </div>
        </div>
      </div>

      <div class="card">
        <h2>回報前檢核</h2>
        <ul class="bullet-list" id="checklist"></ul>
      </div>
    </section>

    <section class="grid two">
      <div class="card">
        <h2>本輪方法論重點</h2>
        <div id="method-highlights" class="stack"></div>
      </div>
      <div class="card">
        <h2>本輪輸出目標</h2>
        <div id="current-output-goals" class="stack"></div>
      </div>
    </section>
  </main>

  <script src="./assets/js/app.js"></script>
</body>
</html>
