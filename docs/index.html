<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SA Learning Hub</title>
  <link rel="stylesheet" href="./assets/css/style.css" />
</head>
<body data-page="home">
  <header class="site-header">
    <nav class="nav">
      <a href="./index.html" class="active">首頁</a>
      <a href="./weekly.html">每週進度</a>
      <a href="./mindmap.html">心智圖</a>
      <a href="../README.md">README</a>
    </nav>
  </header>

  <main class="container">
    <section class="hero card">
      <div class="eyebrow">目前主線</div>
      <h1 id="hero-title">SA Learning Hub</h1>
      <p id="hero-subtitle" class="muted"></p>
      <div class="hero-meta">
        <div class="hero-chip">
          <span class="chip-label">目前焦點</span>
          <strong id="hero-focus"></strong>
        </div>
        <div class="hero-chip">
          <span class="chip-label">下一步</span>
          <strong id="hero-next"></strong>
        </div>
      </div>
    </section>

    <section class="grid grid-2">
      <div class="card">
        <div class="section-head">
          <h2>本週焦點與節奏</h2>
        </div>
        <div id="current-week-panel" class="focus-box"></div>
      </div>
      <div class="card">
        <div class="section-head">
          <h2>本輪方法論重點</h2>
        </div>
        <ul id="method-highlights" class="clean-list"></ul>
      </div>
    </section>

    <section class="card">
      <div class="section-head">
        <h2>12 週進度總覽</h2>
        <button id="toggle-weeks" class="ghost-btn" type="button">查看更多</button>
      </div>
      <div id="weeks-grid" class="weeks-grid"></div>
    </section>

    <section class="card">
      <div class="section-head">
        <h2>任務進度</h2>
      </div>
      <div class="task-board task-board-2">
        <div class="board-col">
          <div class="board-title">進行中</div>
          <div id="board-doing"></div>
        </div>
        <div class="board-col">
          <div class="board-title">待開始</div>
          <div id="board-todo"></div>
        </div>
      </div>
    </section>

    <section class="grid grid-2">
      <div class="card">
        <div class="section-head">
          <h2>回報前檢核</h2>
        </div>
        <ul id="report-checklist" class="clean-list"></ul>
      </div>
      <div class="card">
        <div class="section-head">
          <h2>本週預計產出</h2>
        </div>
        <ul id="current-outputs" class="clean-list"></ul>
      </div>
    </section>
  </main>

  <script src="./assets/js/app.js"></script>
</body>
</html>
