  <header>
    <nav>
      <a href="./index.html">首頁</a>

      <a href="./mindmap.html">心智圖</a>
    </nav>

  <main>
    <section class="hero">
      <div class="hint">每週固定回報格式</div>
      <h1>Weekly Review Template</h1>
      <p class="hint">每週回來時，可以直接按這個格式整理後貼給我。</p>
    </section>

    <section class="panel">
      <div class="codebox">1. 這週學了什麼
2. 做了哪些題目
3. 產出了什麼
4. 卡在哪裡
5. 想讓我幫你檢查什麼
6. 下週準備做什麼</div>
    </section>

    <section class="panel" style="margin-top:18px;">
      <h2>每週檢核</h2>
      <ul class="clean">
        <li>能不能不用看答案重寫</li>
        <li>能不能白話解釋</li>
        <li>能不能對應工作情境</li>
        <li>有沒有留下產出</li>
        <li>有沒有記錄錯誤與修正</li>
      </ul>
    </section>
